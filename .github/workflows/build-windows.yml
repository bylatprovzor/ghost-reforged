name: Сборка для Windows

on:
  push:
    branches: [survchaos]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ hashFiles('Cargo.lock') }}
      - name: Тесты
        continue-on-error: true
        shell: pwsh
        run: |
          cargo test --locked --release 2>&1 | Tee-Object -FilePath test.log
          $code = $LASTEXITCODE
          if ($code -ne 0) {
            Get-Content test.log | Select-String -Pattern 'error(\[E\d+\])?:|panicked|^---- |FAILED|failures:|left:|right:|-->' | Select-Object -First 40 | ForEach-Object { Write-Output "::error::$($_.Line.Trim())" }
            exit $code
          }
      - name: Сборка
        run: cargo build --locked --release --bin ghost-reforged --bin ghost-reforged-cli
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-reforged-survchaos
          path: |
            target/release/ghost-reforged.exe
            target/release/ghost-reforged-cli.exe
            SURVCHAOS.md
