name: Windows build (survchaos.ru)

on:
  push:
    branches: [survchaos-sc]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Rust
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-sc-${{ hashFiles('Cargo.lock') }}
      - name: Tests
        run: cargo test --locked --release --all-features
      - name: Package
        shell: pwsh
        run: powershell -File packaging/windows/build.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: ghost-reforged-survchaos
          path: target/package/*.zip
